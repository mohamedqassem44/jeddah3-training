<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — slim top bar, one column (max 980px), fixed bottom tab bar on phones / inline tabs on desktop.
   Palette: Al-Dawaa ribbon gold on deep indigo-navy; neutrals tinted toward the navy. */
:root{
  --bg:#F5F5FA; --surface:#FFFFFF; --sunk:#ECECF4; --ink:#1E1D45; --muted:#5D5C7E; --faint:#8C8BA8; --line:#E2E1EE;
  --navy:#2C2A6E; --navy-2:#3A3890; --on-navy:#FFFFFF; --on-navy-2:#CFCDEB;
  --accent:#2C2A6E; --accent-ink:#FFFFFF; --accent-soft:#E9E8F6; --icon-fg:#2C2A6E;
  --gold:#F2B90F; --gold-deep:#D99A00; --gold-soft:#FFF4CF; --gold-ink:#2C2A6E;
  --ok:#1C7A4A; --ok-soft:#DCF1E4; --warn:#8F5A00; --warn-soft:#FFF0CC; --bad:#B23A3A; --bad-soft:#F8E1E1; --wa:#178A4C;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgb(30 29 69/.05),0 6px 18px rgb(30 29 69/.06);
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100F24; --surface:#1A1937; --sunk:#232145; --ink:#ECEBFA; --muted:#A4A2C8; --faint:#7E7CA4; --line:#2E2C55;
  --navy:#24225A; --navy-2:#2F2D6E; --on-navy:#FFFFFF; --on-navy-2:#BEBCE6;
  --accent:#F5C12E; --accent-ink:#1E1D45; --accent-soft:#2A2850; --icon-fg:#F5C12E;
  --gold:#F5C12E; --gold-deep:#E0A60A; --gold-soft:#3A3014; --gold-ink:#1E1D45;
  --ok:#5CCB8E; --ok-soft:#173326; --warn:#F2C25A; --warn-soft:#3A2E12; --bad:#EC8484; --bad-soft:#3A1C1C; --wa:#2FB36A;
  --shadow:0 1px 2px rgb(0 0 0/.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100F24; --surface:#1A1937; --sunk:#232145; --ink:#ECEBFA; --muted:#A4A2C8; --faint:#7E7CA4; --line:#2E2C55;
  --navy:#24225A; --navy-2:#2F2D6E; --on-navy:#FFFFFF; --on-navy-2:#BEBCE6;
  --accent:#F5C12E; --accent-ink:#1E1D45; --accent-soft:#2A2850; --icon-fg:#F5C12E;
  --gold:#F5C12E; --gold-deep:#E0A60A; --gold-soft:#3A3014; --gold-ink:#1E1D45;
  --ok:#5CCB8E; --ok-soft:#173326; --warn:#F2C25A; --warn-soft:#3A2E12; --bad:#EC8484; --bad-soft:#3A1C1C; --wa:#2FB36A;
  --shadow:0 1px 2px rgb(0 0 0/.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font:600 1.25rem/1.35 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 1rem/1.4 var(--f-display);margin:0}
p{margin:0}
.lede{color:var(--muted);font-size:.92rem;max-width:62ch}
.eyebrow{font-size:.72rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.note{font-size:.82rem;color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* app bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.mark{width:40px;height:40px;border-radius:12px;background:#fff;color:#2C2A6E;display:grid;place-items:center;font:700 21px/1 Georgia,serif;flex:none;box-shadow:0 0 0 2px var(--gold)}
.brand{min-width:0}
.brand h1{font:600 1.02rem/1.25 var(--f-display);margin:0}
.brand p{color:var(--on-navy-2);font-size:.74rem}
.who{margin-inline-start:auto;font-size:.72rem;color:var(--on-navy);background:rgb(255 255 255/.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
.ribbon{height:3px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
nav.tabs{display:flex;gap:4px;padding-block:0 10px}
nav.tabs button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--on-navy-2);font:500 .88rem var(--f-body);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-selected="true"]{background:rgb(255 255 255/.14);color:#fff}
nav.tabs button:hover{color:#fff}
@media (max-width:759px){
  nav.tabs{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;gap:0;box-shadow:0 -4px 16px rgb(30 29 69/.06)}
  nav.tabs button{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.68rem;color:var(--muted);border-radius:10px;min-width:0}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button[aria-selected="true"]{background:transparent;color:var(--ink)}
  nav.tabs button[aria-selected="true"] svg{color:var(--gold-deep)}
  main{padding-bottom:calc(var(--nav-h) + 28px)!important}
  .foot{padding-bottom:calc(var(--nav-h) + 20px)!important}
}
main{padding-block:20px 56px;display:grid;gap:22px}
.sect{display:grid;gap:12px}
.sect-h{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* buttons, chips, banners */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:var(--r-sm);padding:10px 16px;font:600 .88rem var(--f-body);cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.gold{background:var(--gold);color:#2C2A6E}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.wait{background:var(--warn-soft);color:var(--warn)} .chip.muted{background:var(--sunk);color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:10px 14px;font-size:.86rem}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
#install div{display:grid;gap:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;color:var(--muted);text-align:center;font-size:.9rem}
.empty strong{color:var(--ink);display:block;margin-bottom:4px;font-family:var(--f-display)}

/* hero */
.hero{background:var(--navy);color:var(--on-navy);border-radius:20px;padding:24px 22px;display:grid;gap:12px;position:relative;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;left:-22px;width:56px;height:240px;border-radius:30px;transform:rotate(-32deg)}
.hero::before{top:-70px;background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.hero::after{top:-24px;left:44px;width:40px;height:180px;background:linear-gradient(180deg,var(--gold-deep),var(--gold));opacity:.5}
.hero > *{max-width:calc(100% - 70px)}
.hero h2{font-size:1.5rem;color:inherit}
.hero p{color:var(--on-navy-2);max-width:52ch}
.hero .eyebrow{color:var(--gold)}
@media (max-width:759px){.preview-switch{bottom:calc(env(safe-area-inset-bottom,0px) + var(--nav-h) + 14px)}}
@media (max-width:520px){.tile.primary{grid-column:1/-1}.hero{padding:20px 18px}.hero h2{font-size:1.28rem}.hero::before{left:-38px;opacity:.85}.hero::after{left:18px;opacity:.35}.hero > *{max-width:100%}}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:2px}
.facts div{display:grid}
.facts b{font:600 1.35rem/1.2 var(--f-display);color:var(--gold)}
.facts span{font-size:.74rem;color:var(--on-navy-2)}

/* manager shortcuts */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);cursor:pointer;font:inherit;text-align:start}
.tile:hover{border-color:var(--gold)}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--icon-fg)}
.tile.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tile.primary .ic{background:var(--gold);color:#2C2A6E}
.tile.primary span{color:var(--on-navy-2)}
.tile b{font:600 .95rem var(--f-display)}
.tile span{font-size:.78rem;color:var(--muted);line-height:1.45}
.tile.off{opacity:.55;cursor:default}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.st{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.st .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--warn);flex:none}
.st div{min-width:0;display:grid;gap:2px}
.st b{font:600 .92rem var(--f-display)}

/* journey */
.journey{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.journey li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:16px}
.journey li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.journey .dot{counter-increment:s;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--gold);color:var(--ink);font:700 .95rem var(--f-display)}
.journey .dot::before{content:counter(s)}
.journey .txt{display:grid;gap:2px;padding-top:6px;min-width:0}
.journey .txt b{font:600 .98rem var(--f-display)}
.journey .when{font-size:.74rem;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 8px;border-radius:99px;justify-self:start;margin-top:3px}

/* 24-day plan strip */
.plan{display:grid;gap:10px}
.strip{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.strip i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.84rem;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0}
.legend b{font-weight:600;color:var(--muted);font-size:.78rem;white-space:nowrap}

/* materials */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.cat .ic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--icon-fg)}
.cat b{font:600 .95rem/1.3 var(--f-display)}
.cat span{font-size:.76rem;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cat[aria-pressed="true"] .ic{background:var(--gold);color:#2C2A6E}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:0;padding:11px 0;outline:none}
.files{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.file{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.ft{width:40px;height:44px;border-radius:8px;flex:none;display:grid;place-items:end center;padding-bottom:6px;font:700 .58rem var(--f-body);letter-spacing:.04em;color:#fff;background:#B23A3A;position:relative}
.ft::before{content:"";position:absolute;top:0;inset-inline-end:0;border-width:0 0 12px 12px;border-style:solid;border-color:transparent transparent rgb(255 255 255/.35) transparent}
.ft.pptx{background:#C4572B}.ft.docx{background:#2B5DB2}
.file a.t{flex:1;min-width:0;display:grid;text-decoration:none;color:var(--ink);font-size:.9rem;line-height:1.45}
.file a.t bdi{overflow-wrap:anywhere}
.file a.t:hover bdi{text-decoration:underline;text-decoration-color:var(--gold)}
.file .dl{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--ink);flex:none}
.file .dl:hover{background:var(--gold-soft)}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk);font:600 .85rem var(--f-display)}
.grp-h a{font:600 .78rem var(--f-body);color:var(--accent);text-decoration:none}
.featured{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.feat{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--ink);min-width:0}
.feat:hover{border-color:var(--gold)}
.feat div{min-width:0;display:grid}
.feat b{font:600 .88rem/1.35 var(--f-display);overflow-wrap:anywhere}
.feat span{font-size:.74rem;color:var(--muted)}
.badge-new{font-size:.66rem;font-weight:700;color:#2C2A6E;background:var(--gold);padding:1px 7px;border-radius:99px;margin-inline-start:6px;vertical-align:middle}

/* trainees */
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
label.f em{font-style:normal;color:var(--bad)}
input[type=text],input[type=tel]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
.list{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--icon-fg);font:600 .95rem var(--f-display);flex:none}
.row .who2{flex:1;min-width:150px;display:grid}
.row .who2 b{font:600 .95rem var(--f-display)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.grp ul{margin:0;padding-inline-start:18px;font-size:.84rem;color:var(--muted);display:grid;gap:2px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding-block:18px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
.foot b{color:var(--ink)}
.preview-switch{position:fixed;z-index:40;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);inset-inline-end:max(12px,env(safe-area-inset-left,0px));display:flex;gap:2px;background:var(--ink);color:var(--bg);border-radius:99px;padding:3px;font-size:.72rem;box-shadow:var(--shadow)}
.preview-switch button{border:0;background:transparent;color:inherit;font:600 .72rem var(--f-body);padding:5px 10px;border-radius:99px;cursor:pointer}
.preview-switch button[aria-pressed="true"]{background:var(--gold);color:#2C2A6E}
@media (prefers-reduced-motion:no-preference){.btn,.tile,.cat,.feat,nav.tabs button{transition:background .15s,border-color .15s,color .15s}}

/* ===== v2: الدخول والصلاحيات ===== */
.top .acts{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.top .who{margin:0}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:rgb(255 255 255/.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px}
.login{min-height:100vh;min-height:100dvh;display:grid;align-content:start;background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden;isolation:isolate}
.login::before,.login::after{content:"";position:absolute;z-index:-1;left:-40px;width:70px;height:240px;border-radius:40px;transform:rotate(-32deg)}
.login::before{top:-110px;background:linear-gradient(180deg,var(--gold),var(--gold-deep))}
.login::after{top:-80px;left:44px;width:50px;height:190px;background:linear-gradient(180deg,var(--gold-deep),var(--gold));opacity:.45}
.login .wrap{width:100%;max-width:440px;padding-block:max(120px,16vh) 40px;display:grid;gap:22px}
.login .mark{width:64px;height:64px;font-size:32px;border-radius:18px}
.login h1{font:600 1.5rem/1.3 var(--f-display);margin:0}
.login .sub{color:var(--on-navy-2);font-size:.9rem}
.lcard{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 20px;display:grid;gap:14px;box-shadow:0 10px 30px rgb(0 0 0/.18)}
.lcard h2{font-size:1.15rem}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
.field input{font:600 1.15rem var(--f-display);letter-spacing:.06em;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;text-align:center;direction:ltr}
.field input:focus{outline:none;border-color:var(--gold)}
.field input.pin{letter-spacing:.7em;font-size:1.5rem;padding-inline-start:calc(14px + .7em)}
.lcard .btn{width:100%;padding:13px 16px;font-size:.95rem}
.linkbtn{background:none;border:0;color:var(--accent);font:600 .85rem var(--f-body);cursor:pointer;padding:4px;justify-self:center}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--navy)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:.86rem}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:.86rem}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid rgb(255 255 255/.35);border-top-color:#fff;animation:sp 1s linear infinite}
.btn.ghost .spinner,.lcard .btn.ghost .spinner{border-color:var(--line);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}

  let j;try{j=await r.json()}catch(e){throw new Error("السيرفر مش بيرد دلوقتي. جرّب تاني بعد شوية.")}
  if(!j.ok){if(j.error==="AUTH"){logout(true);throw new Error("انتهت الجلسة. ادخل تاني.")}throw new Error(j.error||"حصل خطأ.")}
  return j;
}
const ckey=k=>"j3c-"+(S.user?S.user.uid:"x")+"-"+k;
async function load(key,action,body,force){
  if(S.cache[key]&&!force)return S.cache[key];
  try{const j=await api(action,body);S.cache[key]=j;S.offline=false;try{localStorage.setItem(ckey(key),JSON.stringify(j))}catch(e){}return j}
  catch(e){let c=null;try{c=JSON.parse(localStorage.getItem(ckey(key))||"null")}catch(_){}
    if(c&&/اتصال|السيرفر/.test(e.message)){S.offline=true;S.cache[key]=c;return c}throw e}
}

async function loginStep(fn){S.login.err="";S.login.ok="";S.busy=true;renderLogin();try{await fn()}catch(e){S.login.err=e.message}S.busy=false;if(!S.user)renderLogin()}
function finishLogin(j){const keep=S.login.remember!==false;S.token=j.token;S.user=j.user;store.set("j3-token",j.token,keep);store.set("j3-user",JSON.stringify(j.user),keep);
  S.login={step:"id",uid:j.user.uid};S.tab="home";S.sub=null;S.cache={};renderApp()}
document.addEventListener("submit",e=>{e.preventDefault();if(S.busy)return;const id=e.target.id;const L=S.login;
  const val=k=>{const el=document.getElementById(k);return el?el.value.trim():""},chk=()=>{const el=document.getElementById("remember");return el?el.checked:true};
  if(id==="f-id"){const uid=val("uid");loginStep(async()=>{L.uid=uid;const j=await api("auth.start",{uid});Object.assign(L,{uid:j.uid,first:j.first,email:j.email,hasPin:j.hasPin});L.step=j.hasPin?"pin":"start"})}
  if(id==="f-pin"){const pin=val("pin");L.remember=chk();loginStep(async()=>{const j=await api("auth.pin",{uid:L.uid,pin,remember:L.remember});finishLogin(j)})}
  if(id==="f-start")loginStep(async()=>{const j=await api("auth.sendCode",{uid:L.uid});L.email=j.email;L.step="code"});
  if(id==="f-code"){const code=val("code");loginStep(async()=>{const j=await api("auth.verifyCode",{uid:L.uid,code});L.setup=j.setupToken;L.step="newpin"})}
  if(id==="f-new"){const a=val("p1"),b=val("p2");L.remember=chk();loginStep(async()=>{
    if(!/^\d{4}$/.test(a))throw new Error("الـ PIN لازم يكون 4 أرقام.");if(a!==b)throw new Error("الـ PIN مش متطابق في المرتين.");
    const j=await api("auth.setPin",{setupToken:L.setup,pin:a,remember:L.remember});finishLogin(j)})}
});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||!S.login||S.user)return;const L=S.login;
  if(t.id==="other"){S.login={step:"id",uid:""};renderLogin()}
  if(t.id==="forgot")loginStep(async()=>{const j=await api("auth.sendCode",{uid:L.uid});L.email=j.email;L.step="code"});
  if(t.id==="resend")loginStep(async()=>{const j=await api("auth.sendCode",{uid:L.uid});L.email=j.email;L.ok="الكود اتبعت تاني."});
});
function logout(expired){store.del("j3-token");store.del("j3-user");S.token=null;S.user=null;S.cache={};S.login={step:"id",uid:"",err:expired?"انتهت الجلسة. ادخل تاني.":""};renderLogin()}

function ring(p,label){const r=48,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,p))/100);
  return `<svg class="ring" viewBox="0 0 118 118" role="img" aria-label="التقدم ${p}%"><circle class="pad" cx="59" cy="59" r="58"/><circle class="bgc" cx="59" cy="59" r="${r}"/><circle class="fg" cx="59" cy="59" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><text x="59" y="62">${p}%</text><text class="s" x="59" y="80">${label}</text></svg>`}
function spark(rows){const pts=rows.filter(q=>q.pct!=null).slice().reverse();if(pts.length<2)return "";
  const W=320,H=120,pl=26,pr=10,pt=12,pb=22,X=i=>pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(100-v)*(H-pt-pb)/100;
  const line=pts.map((q,i)=>`${X(i).toFixed(1)},${Y(q.pct).toFixed(1)}`).join(" ");
  return `<div class="card"><div class="sect-h"><h3>درجاتك في الاختبارات</h3><span class="note">آخر ${pts.length} اختبارات</span></div>
  <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى الدرجات">${[0,50,100].map(v=>`<line class="gd" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join("")}
  <polygon class="ar" points="${X(0)},${Y(0)} ${line} ${X(pts.length-1)},${Y(0)}"/><polyline class="ln" points="${line}"/>
  ${pts.map((q,i)=>`<circle class="dot" cx="${X(i)}" cy="${Y(q.pct)}" r="3.5"/><text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(fmtShort(q.day))}</text>`).join("")}</svg></div>`}
const scoreCls=p=>p==null?"":p>=80?"good":p>=50?"mid":"low";

async function act(btn,action,body,done){if(btn.dataset.busy)return;btn.dataset.busy=1;btn.disabled=true;
  try{const j=await api(action,body);S.cache={};await done(j)}catch(e){toast(e.message)}finally{delete btn.dataset.busy;btn.disabled=false}}
function arm(btn,label){if(btn.dataset.armed)return true;btn.dataset.armed=1;const old=btn.innerHTML;btn.innerHTML=label;btn.classList.add("armed");
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=old;btn.classList.remove("armed")}},4000);return false}
async function onAct(b){const a=b.dataset.act,uid=b.dataset.uid;
  if(a==="invite-open"){S.form={kind:"invite"};S.formErr="";S.result=null;if(S.tab!=="people"||S.sub){S.tab="people";S.sub=null;renderApp()}else draw();window.scrollTo(0,0);return}
  if(a==="trainer-new"){S.form={kind:"trainer",isNew:true};S.formErr="";S.result=null;draw();window.scrollTo(0,0);return}
  if(a==="trainer-edit"){const u=(S.usersCache||[]).find(x=>x.uid===uid);S.form=Object.assign({kind:"trainer",isNew:false},u);S.formErr="";S.result=null;draw();window.scrollTo(0,0);return}
  if(a==="form-close"){S.form=null;S.formErr="";draw();return}
  if(a==="copy"){const t=b.dataset.text;try{await navigator.clipboard.writeText(t);toast("الرابط اتنسخ")}catch(e){toast("ما قدرتش أنسخ — الرابط في إيميل الدعوة")}return}
  if(a==="result-close"){S.result=null;draw();return}
  if(a==="state")return act(b,"users.state",{uid,state:b.dataset.state},async j=>{toast(b.dataset.state==="موقوف"?"الحساب اتوقف":"الحساب اتفعّل");await draw(true)});
  if(a==="reset"){if(!arm(b,"اضغط تاني للتأكيد"))return;return act(b,"users.resetPin",{uid},async()=>{toast("الـ PIN اتصفّر. هيختار واحد جديد بكود الإيميل.");await draw(true)})}
  if(a==="del-trainer"){if(!arm(b,"تأكيد حذف "+esc(b.dataset.name)+"؟"))return;return act(b,"users.delete",{uid},async()=>{toast("المدرب اتحذف");await draw(true)})}
  if(a==="del-trainee"){if(!arm(b,"تأكيد حذف "+esc(b.dataset.name)+"؟"))return;return act(b,"trainee.delete",{key:b.dataset.key},async j=>{toast("اتحذف: "+j.deleted);S.sub=null;S.tab="people";renderApp()})}
}

  if(id==="f-trainer"){const F=S.form,n=document.getElementById("t-notify");const body={isNew:F.isNew,uid:F.isNew?val("t-uid"):F.uid,name:val("t-name"),phone:val("t-phone"),email:val("t-email"),notify:n?n.checked:false};Object.assign(S.form,body);

});
async function formStep(action,body,res){S.busy=true;S.formErr="";draw();
  try{const j=await api(action,body);S.cache={};S.form=null;S.result=res(j)}catch(e){S.formErr=e.message}S.busy=false;await draw(true);window.scrollTo(0,0)}

/* تحميل ملف من الـ API */
async function getFile(id,btn){if(btn.dataset.busy)return;btn.dataset.busy=1;toast("بحمّل الملف…");
  try{const j=await api("file",{id});const bin=atob(j.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:j.mime||"application/octet-stream"}));const a=document.createElement("a");a.href=url;a.download=j.name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);toast("اتحمّل: "+j.name)}
  catch(e){toast(e.message)}finally{delete btn.dataset.busy}}

/* ===== أحداث ===== */
document.addEventListener("click",e=>{if(!S.user)return;
  const tab=e.target.closest("[data-tab]");if(tab){S.tab=tab.dataset.tab;S.sub=null;S.form=null;S.result=null;renderApp();window.scrollTo(0,0);return}
  const go=e.target.closest("[data-go]");if(go){S.tab=go.dataset.go;S.sub=null;S.form=null;S.result=null;renderApp();window.scrollTo(0,0);return}
  if(e.target.closest("#logout")){logout();return}
  if(e.target.closest("[data-retry]")){draw(true);return}
  if(e.target.closest("[data-back]")){S.sub=S.sub&&S.sub.parent||null;draw();window.scrollTo(0,0);return}
  const qz=e.target.closest("[data-quiz]");if(qz){S.sub={kind:"quiz",formId:qz.dataset.quiz,key:qz.dataset.key||"",parent:S.sub};draw();window.scrollTo(0,0);return}
  const tr=e.target.closest("[data-trainee]");if(tr){S.sub={kind:"trainee",key:tr.dataset.trainee};draw();window.scrollTo(0,0);return}
  const ab=e.target.closest("[data-act]");if(ab){onAct(ab);return}
  const fb=e.target.closest("[data-file]");if(fb){getFile(fb.dataset.file,fb);return}
  const fc=e.target.closest("[data-filter]");if(fc){S.filter=fc.dataset.filter;draw();return}
  const c=e.target.closest(".cat[data-cat]");if(c){const i=+c.dataset.cat;S.cat=S.cat===i?-1:i;document.querySelectorAll(".cat").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.cat===S.cat));$("#mat-list").innerHTML=matList();return}
});
document.addEventListener("input",e=>{if(e.target.id==="mat-q"){S.q=e.target.value;$("#mat-list").innerHTML=matList()}});
let pullY=null;document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.user&&!S.sub&&!S.form&&!S.result){S.cache={};draw()}});

/* ===== تشغيل ===== */
(function boot(){
  const t=store.get("j3-token"),u=store.get("j3-user");
  if(t&&u){try{S.token=t;S.user=JSON.parse(u);renderApp();return}catch(e){}}
  renderLogin();
})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
